name: RNA toolkit checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the package as a reader would
        run: python -m pip install .
      - name: Install walkthrough dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m pip install -r requirements-notebooks.txt
      - name: Verify installed package, examples, tests, and notebook
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python scripts/verify_repo.py --notebook --output outputs/verification.json
      - name: Verify installed package, examples, and tests
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.12'
        run: python scripts/verify_repo.py --output outputs/verification.json
      - name: Preserve verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            outputs/verification.json
            outputs/executed_walkthrough.ipynb
          retention-days: 14
          if-no-files-found: warn
